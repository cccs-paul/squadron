server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver so nginx can start even when
    # upstream services (squadron-gateway) are not yet running.
    # The 'valid=10s' means DNS results are cached for 10 seconds,
    # allowing nginx to pick up newly started backend containers quickly.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API proxy to gateway — agent test endpoint (long-running LLM inference)
    location /api/agents/test/ {
        set $gateway http://squadron-gateway:8443;
        proxy_pass $gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API proxy to gateway
    # Using a variable ($gateway) forces nginx to resolve at request time
    # rather than at startup, so the UI container can start independently.
    # NOTE: When proxy_pass uses a variable, nginx does NOT strip/replace the
    # location prefix.  We must use $request_uri to forward the full original
    # path (e.g. /api/auth/tenants) instead of just the static /api/ prefix.
    location /api/ {
        set $gateway http://squadron-gateway:8443;
        proxy_pass $gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout quickly if the gateway isn't up yet so the browser
        # gets a fast error response instead of hanging.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # WebSocket proxy to gateway
    location /ws/ {
        set $gateway_ws http://squadron-gateway:8443;
        proxy_pass $gateway_ws$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout quickly on connect if the gateway isn't up
        proxy_connect_timeout 5s;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket timeouts (long-lived connections)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Angular SPA routing: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
